plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sanjay.dinkar'
    compileSdk 34

    defaultConfig {
        applicationId "com.sanjay.dinkar"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (project.hasProperty('DINKAR_STORE_FILE')) {
                storeFile file(DINKAR_STORE_FILE)
                storePassword DINKAR_STORE_PASSWORD
                keyAlias DINKAR_KEY_ALIAS
                keyPassword DINKAR_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('DINKAR_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
